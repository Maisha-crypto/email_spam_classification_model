readme = "README.md"
authors = [
    { name = "Maisha Bopape", email = "maisha.bopape@valterraplatinum.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
